name: Build Tuneo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Force toujours le tout dernier commit de main, peu importe la branche
          # sélectionnée dans le menu de déclenchement manuel sur GitHub.
          ref: main

      - name: Afficher le commit compilé (pour vérifier qu'on est bien à jour)
        run: git log -1 --oneline

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuneo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
